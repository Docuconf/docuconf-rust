[workspace]
members = ["docuconf", "docuconf-derive", "examples/orders", "readme"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/docuconf/docuconf-rust"
homepage = "https://docuconf.dev/languages/rust/"
authors = ["docuconf contributors"]
license = "MIT"

# Certificate and keystore tests run much faster with optimised dependencies.
[profile.dev.package."*"]
opt-level = 2
