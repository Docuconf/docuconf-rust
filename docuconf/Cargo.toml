[package]
name = "docuconf"
description = "Typed configuration contracts for figment: export a CUE contract and validate env vars and files at boot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["config", "kubernetes", "figment", "cue", "tls"]
categories = ["config", "development-tools"]
readme = "../README.md"

[dependencies]
docuconf-derive = { version = "=0.1.0", path = "../docuconf-derive" }
figment = { version = "0.10.19", features = ["json", "toml", "yaml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
jsonschema = { version = "0.58", default-features = false }
regex = "1"
url = { version = "2", features = ["serde"] }
humantime = "2"
humantime-serde = "1"
log = "0.4"
dotenvy = "0.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.10", features = ["std"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
x509-parser = "0.18"
p12-keystore = "0.3"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
