[package]
name = "docuconf"
description = "Typed configuration contracts for figment: export a CUE contract and validate env vars and files at boot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
license.workspace = true
keywords = ["config", "kubernetes", "figment", "cue", "tls"]
categories = ["config", "development-tools"]
readme = "../README.md"

[features]
default = ["tls", "keystore"]
# TlsKeyPair and CaBundle file inputs: certificate, key and chain checks with
# rustls, ring, webpki and x509-parser. Turn default features off for a
# service that only reads environment variables.
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki", "dep:x509-parser"]
# Keystore (PKCS#12) file inputs.
keystore = ["tls", "dep:p12-keystore"]
# Accept secrecy::SecretBox<T> and secrecy::SecretString as secret fields.
secrecy = ["dep:secrecy"]

[dependencies]
docuconf-derive = { version = "=0.1.0", path = "../docuconf-derive" } # x-release-please-version
figment = { version = "0.10.19", features = ["json", "toml", "yaml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "1"
jsonschema = { version = "0.58", default-features = false }
regex = "1"
url = { version = "2", features = ["serde"] }
humantime = "2"
humantime-serde = "1"
log = "0.4"
dotenvy = "0.15"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pki-types = { version = "1.10", features = ["std"], optional = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"], optional = true }
x509-parser = { version = "0.18", optional = true }
p12-keystore = { version = "0.3", optional = true }
secrecy = { version = "0.10", features = ["serde"], optional = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
base64 = "0.23"

[[example]]
name = "export"
required-features = ["tls"]
