name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4

      # The contract meta-schema (spec/cue) and the shared conformance suite
      # (conformance/cases.json) live in docuconf-go; the export tests vet
      # generated contracts against the one, and tests/conformance.rs runs
      # the other.
      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"

      - name: Docs
        if: matrix.rust == 'stable'
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package
        if: matrix.rust == 'stable'
        run: cargo package --workspace --exclude orders --locked

  # examples/orders: builds against the SDK in this repository, keeps its
  # committed contract.cue in step with the code, and boots.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Build
        run: cargo build --locked -p orders

      - name: Contract is up to date
        working-directory: examples/orders
        run: |
          cargo run --locked --quiet -p orders -- export "$RUNNER_TEMP/contract.cue"
          diff -u contract.cue "$RUNNER_TEMP/contract.cue" \
            || { echo "contract.cue is stale: run 'cargo run -p orders -- export contract.cue' in examples/orders"; exit 1; }

      - name: Vet the contract
        run: |
          vet="$RUNNER_TEMP/vet"
          mkdir -p "$vet/orders"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$vet/"
          cp examples/orders/contract.cue "$vet/orders/"
          cd "$vet" && "$(go env GOPATH)/bin/cue" vet -c ./orders

      - name: Smoke test
        run: examples/orders/smoke.sh
