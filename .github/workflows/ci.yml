name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      docuconf_go_ref:
        description: docuconf-go ref to test against (empty = .github/docuconf-go.ref)
        required: false
        default: ""
  # Nightly against docuconf-go main, to catch spec changes before a bump PR.
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.89"]
    steps:
      - uses: actions/checkout@v4

      # The contract meta-schema (spec/cue) and the shared conformance suite
      # (conformance/cases.json) live in docuconf-go; the export tests vet
      # generated contracts against the one, and tests/conformance.rs runs
      # the other.
      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      # The docuconf-go-facing subset (conformance suite, cue vet of exported
      # contracts); docuconf-go's downstream workflow runs the same script.
      - name: Run scripts/conformance.sh
        run: scripts/conformance.sh
        env:
          DOCUCONF_GO_DIR: ${{ github.workspace }}/docuconf-go
      - name: Format
        if: matrix.rust == 'stable'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.rust == 'stable'
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo clippy -p docuconf --all-targets --no-default-features --locked -- -D warnings

      # The README crate's doctests compile every Rust block in README.md
      # (and run the test blocks) with only docuconf and serde as
      # dependencies.
      - name: Test
        run: cargo test --workspace --all-features --locked
        env:
          DOCUCONF_SPEC_CUE: ${{ github.workspace }}/docuconf-go/spec/cue
          DOCUCONF_REQUIRE_VET: "1"
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"

      # An env-only service: no rustls, ring, webpki, x509-parser or PKCS#12.
      - name: Test without default features
        run: |
          cargo test -p docuconf --no-default-features --lib --tests --locked
          ! cargo tree -p docuconf --no-default-features -e normal --locked | grep -E '^.*(rustls|ring|x509-parser|p12-keystore) v'
        env:
          DOCUCONF_CONFORMANCE: ${{ github.workspace }}/docuconf-go/conformance/cases.json
          DOCUCONF_REQUIRE_CONFORMANCE: "1"

      - name: Docs
        if: matrix.rust == 'stable'
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Package
        if: matrix.rust == 'stable'
        run: cargo package --workspace --exclude orders --exclude docuconf-readme --locked

  # examples/orders: builds against the SDK in this repository, keeps its
  # committed contract.cue in step with the code, and boots.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the docuconf-go ref
        id: dcref
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.docuconf_go_ref }}
        run: |
          if [ "$EVENT" = schedule ]; then echo "ref=main" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_REF" ]; then echo "ref=$INPUT_REF" >> "$GITHUB_OUTPUT"
          else echo "ref=$(tr -d '[:space:]' < .github/docuconf-go.ref)" >> "$GITHUB_OUTPUT"; fi
      - name: Check out docuconf-go
        uses: actions/checkout@v4
        with:
          repository: docuconf/docuconf-go
          path: docuconf-go
          ref: ${{ steps.dcref.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install cue
        run: go install cuelang.org/go/cmd/cue@v0.17.1

      - name: Build
        run: cargo build --locked -p orders

      - name: Contract is up to date
        working-directory: examples/orders
        run: cargo run --locked --quiet -p orders -- export --check contract.cue

      - name: Vet the contract
        run: |
          vet="$RUNNER_TEMP/vet"
          mkdir -p "$vet/orders"
          cp -r docuconf-go/spec/cue/cue.mod docuconf-go/spec/cue/contract "$vet/"
          cp examples/orders/contract.cue "$vet/orders/"
          cd "$vet" && "$(go env GOPATH)/bin/cue" vet -c ./orders

      - name: Smoke test
        run: examples/orders/smoke.sh
