[package]
name = "orders"
description = "Example service: a configuration declared with docuconf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# The SDK in this repository, not a published version.
docuconf = { path = "../../docuconf" }
hex = "0.4"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
